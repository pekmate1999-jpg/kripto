name: Crypto Report
on:
 # Minden nap reggel 8:00 (UTC)
  workflow_dispatch: # Kézzel is indítható

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erre az engedélyre szükség van a history.json mentéséhez
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
      - name: Commit history changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Portfólió history automatikus frissítése"
          file_pattern: history.json
